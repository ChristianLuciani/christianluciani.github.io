# Chat proxy (#145) — Cloudflare Worker.
# Deploy: ver workers/chat/README.md
#   wrangler secret put OPENROUTER_API_KEY   # NUNCA en el repo ni en vars
#   wrangler deploy
name = "client-lab-chat"
main = "index.mjs"
compatibility_date = "2026-11-06"

[vars]
# Kill switch: CHAT_ENABLED = "false" → 503 chat_disabled
CHAT_ENABLED = "true"
# Budget total USD 1 (alerta 0.75, hard stop 0.95, sin auto-top-up)
BUDGET_USD = "1"
BUDGET_ALERT = "0.75"
BUDGET_STOP = "0.95"
# Allowlist free-first; fallback pago barato si el free devuelve 429/402/5xx.
# Ajustar al deploy según los :free vigentes de OpenRouter.
MODEL_ALLOWLIST = "google/gemini-2.0-flash-exp:free,meta-llama/llama-3.3-70b-instruct:free"
# Contexto servido por el sitio público (sólo perfil público, ≤ 6k tokens)
CONTEXT_URL = "https://christianluciani.github.io/agent/chat-context.json"
# Precios USD por millón de tokens, por modelo (para el budget); los :free son 0
PRICES_JSON = "{}"
# Límites: 5/min/IP · 15/h/IP · 40/día/IP · 100/día global · 300/mes · 1 concurrente/IP · 2 globales · 4 turnos · 300 chars · 250 tokens out
RATE_MIN_IP = "5"
RATE_HOUR_IP = "15"
RATE_DAY_IP = "40"
RATE_DAY_GLOBAL = "100"
RATE_MONTH_GLOBAL = "300"
CONC_IP = "1"
CONC_GLOBAL = "2"
MAX_TURNS_USER = "4"
MAX_MESSAGES = "8"
MAX_INPUT_CHARS = "300"
MAX_OUTPUT_TOKENS = "250"

# Durable Object con los contadores atómicos (rate limit + concurrencia + spend)
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
