name: CI

# Runs unit tests and a production build on every PR into main, so a broken
# build or failing test is caught before it reaches the deployed site.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # el módulo del logo se genera desde la animación: sin drift
      - run: npm run brand:sync
      - run: git diff --exit-code -- src/ts/brand/logoAnim.js
      # gate de fidelidad del logo (#59): el puerto geometry.mjs ≡ DOM aprobado.
      # Chrome headless de linux instalado por el runner; el gate lo resuelve por
      # CHROME_PATH (tools/logo/chrome.mjs) y su error dice si NO pudo medir.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: DIAG chrome (temporal)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          "$CHROME_PATH" --version
          for f in "none" "--no-sandbox" "--disable-dev-shm-usage" "--no-sandbox --disable-dev-shm-usage" "--no-sandbox --disable-dev-shm-usage --no-zygote --single-process"; do
            echo "=== flags: [$f]"
            if [ "$f" = "none" ]; then F=""; else F="$f"; fi
            "$CHROME_PATH" --headless --disable-gpu $F --virtual-time-budget=500 --dump-dom "file://$PWD/index.html" > /tmp/out.html 2>/tmp/err.txt
            echo "exit=$? bytes=$(wc -c < /tmp/out.html)"
            echo "--- stderr head"; head -4 /tmp/err.txt
            echo "--- stderr tail"; tail -2 /tmp/err.txt
          done
          exit 0
      - run: npm run logo:verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run build
