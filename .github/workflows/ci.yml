name: CI

# Runs unit tests and a production build on every PR into main, so a broken
# build or failing test is caught before it reaches the deployed site.

on:
  pull_request:
  # `main` también: un push directo (o un merge) no puede quedar sin tests. El
  # index.html commiteado y el módulo del logo se verifican acá; el deploy los
  # construye pero no corre la suite.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # el módulo del logo se genera desde la animación: sin drift
      - run: npm run brand:sync
      - run: git diff --exit-code -- src/ts/brand/logoAnim.js
      # gate de fidelidad del logo (#59): el puerto geometry.mjs ≡ DOM aprobado.
      # Chrome headless de linux instalado por el runner; el gate lo resuelve por
      # CHROME_PATH (tools/logo/chrome.mjs) y su error dice si NO pudo medir.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: npm run logo:verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run build
      # Migración a CDN (#84): con la base vacía el build tiene que quedar en
      # modo Pages (sin data-local) y con base tiene que reescribir las 8
      # rutas y mapear la ruta del repo (favicons en assets/brand/logo/, OG en
      # public/). El gate vive acá y no en el doc: un mapa roto se ve antes.
      - name: build en modo CDN (8 rutas + data-local)
        run: |
          VITE_ASSET_BASE_URL=https://cdn.example.test/gh/o/r@v1.2.3 npm run build
          grep -q 'src="https://cdn.example.test/gh/o/r@v1.2.3/public/assets/kontablo2026_thumb-7y4PiTON.jpg" data-local="/assets/kontablo2026_thumb-7y4PiTON.jpg"' dist/index.html
          grep -q 'href="https://cdn.example.test/gh/o/r@v1.2.3/assets/brand/logo/favicon-aurea.svg" data-local="/assets/brand/favicon-aurea.svg"' dist/index.html
          grep -q 'content="https://cdn.example.test/gh/o/r@v1.2.3/public/assets/og-image.png"' dist/index.html
          # 8 assets migrados = 4 thumbs + 3 favicons (con data-local) + OG
          # (2 meta tags, sin fallback: un crawler no ejecuta JS).
          test "$(grep -o 'data-local=' dist/index.html | wc -l)" -eq 7
      - name: build en modo Pages (sin data-local)
        run: |
          npm run build
          ! grep -q 'data-local=' dist/index.html
          grep -q 'href="/assets/brand/favicon-aurea.svg"' dist/index.html
