name: CI

# Runs unit tests and a production build on every PR into main, so a broken
# build or failing test is caught before it reaches the deployed site.

on:
  pull_request:
  # `main` también: un push directo (o un merge) no puede quedar sin tests. El
  # index.html commiteado y el módulo del logo se verifican acá; el deploy los
  # construye pero no corre la suite.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # el espejo local de marca debe coincidir con el pin del brand kit
      - run: npm run brand:verify
      - run: npm test
      # el módulo del logo se genera desde la animación: sin drift
      - run: npm run brand:sync
      - run: git diff --exit-code -- src/ts/brand/logoAnim.js
      # gate de fidelidad del logo (#59): el puerto geometry.mjs ≡ DOM aprobado.
      # Chrome headless de linux instalado por el runner; el gate lo resuelve por
      # CHROME_PATH (tools/logo/chrome.mjs) y su error dice si NO pudo medir.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: npm run logo:verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # Migración a CDN (#84): el gate verifica las 8 rutas (no una muestra),
      # el mapa fuente→servida y que el modo Pages no emita data-local. Las
      # rutas son las del repo, que es lo que jsDelivr sirve tal cual.
      - name: build en modo CDN (sitio + brand kit + data-local)
        run: |
          BASE=https://cdn.example.test/gh/o/r@v1.2.3
          BRAND_BASE=https://cdn.example.test/gh/o/brand@v9.9.9
          VITE_ASSET_BASE_URL=$BASE VITE_BRAND_KIT_BASE_URL=$BRAND_BASE npm run build
          # assets del sitio (thumbs)
          for path in \
            public/assets/kontablo2026_thumb-7y4PiTON.jpg \
            public/assets/zambrano2023_thumb-DFrmN1Ce.jpg \
            public/assets/cabrera2006_thumb-ByivZRQD.jpg \
            public/assets/hosaka2006_thumb-KMqoFzTp.jpg ; do
            grep -q "$BASE/$path" dist/index.html || { echo "falta la ruta $path"; exit 1; }
          done
          # marca: brand kit, no el repo del sitio
          for path in favicon-aurea.svg favicon-aurea-32.png apple-touch-icon-aurea.png ; do
            grep -q "$BRAND_BASE/assets/logo/$path" dist/index.html || { echo "falta la marca $path"; exit 1; }
          done
          grep -q "content=\"$BASE/public/assets/og-image.png\"" dist/index.html
          # 7 data-local (4 thumbs + 3 favicons); el OG es meta y no tiene fallback
          test "$(grep -o 'data-local=' dist/index.html | wc -l)" -eq 7
      - name: build en modo Pages (sin data-local, index.html sin drift)
        run: |
          npm run build
          ! grep -q 'data-local=' dist/index.html
          grep -q 'href="/assets/brand/favicon-aurea.svg"' dist/index.html
          # un index.html commiteado en modo CDN rompe build.test.ts; este gate
          # lo dice con el diff, no con un test de 10 líneas de distancia
          git diff --exit-code -- index.html
