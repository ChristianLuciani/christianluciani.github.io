name: CI

# Runs unit tests and a production build on every PR into main, so a broken
# build or failing test is caught before it reaches the deployed site.

on:
  pull_request:
  # `main` también: un push directo (o un merge) no puede quedar sin tests. El
  # index.html commiteado y el módulo del logo se verifican acá; el deploy los
  # construye pero no corre la suite.
  push:
    branches: [main]
  workflow_dispatch:

# Este job sólo lee el repo y el PR: el token no necesita más que eso
# (repo-config §1; deploy.yml declara su propio scope de Pages).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: la guarda del golden lee los trailers
      # (`Golden-Cambio:`) de los commits del PR, y con el checkout shallow por
      # defecto sólo existe el merge sintético — el trailer quedaría invisible.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Invariante I1 (ADR-001): el golden del render no se mueve en un PR de
      # refactor. Si cambia, algún commit tiene que traer el trailer
      # "Golden-Cambio: render|datos"; sin él, un cambio de render + golden
      # regenerado pasaría verde sin que nadie lo vea.
      - name: golden — regenerarlo exige declararlo en el PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run golden:policy
      # el espejo local de marca debe coincidir con el pin del brand kit
      - run: npm run brand:verify
      - run: npm test
      # Guard de cero consumidores (#110/#99): el gate de frescura de
      # profile-data puede estar verde con la demo ciega. Falla si el sitio deja
      # de importar PROFILE o si una superficie migrada al SSOT deja de consumirlo.
      - run: npm run test:consumers
      # Frescura ≠ render (#110): el snapshot commiteado debe ser el render del
      # pipeline. Sin profile-data (CI) valida el render byte a byte + el fixture
      # anonimizado (determinismo y filtro de privados); con --workspace, paridad real.
      - run: npm run sync:check
      # el módulo del logo se genera desde la animación: sin drift
      - run: npm run brand:sync
      - run: git diff --exit-code -- src/ts/brand/logoAnim.js
      # gate de fidelidad del logo (#59): el puerto geometry.mjs ≡ DOM aprobado.
      # Chrome headless de linux instalado por el runner; el gate lo resuelve por
      # CHROME_PATH (tools/logo/chrome.mjs) y su error dice si NO pudo medir.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: npm run logo:verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # Migración a CDN (#84): el gate verifica las 9 rutas de assets + el OG (no una muestra),
      # el mapa fuente→servida y que el modo Pages no emita data-local. Las
      # rutas son las del repo, que es lo que jsDelivr sirve tal cual.
      - name: build en modo CDN (sitio + brand kit + data-local)
        run: |
          BASE=https://cdn.example.test/gh/o/r@v1.2.3
          BRAND_BASE=https://cdn.example.test/gh/o/brand@v9.9.9
          VITE_ASSET_BASE_URL=$BASE VITE_BRAND_KIT_BASE_URL=$BRAND_BASE npm run build
          # assets del sitio (thumbs)
          for path in \
            public/assets/kontablo2026_thumb-7y4PiTON.jpg \
            public/assets/zambrano2023_thumb-DFrmN1Ce.jpg \
            public/assets/cabrera2006_thumb-ByivZRQD.jpg \
            public/assets/hosaka2006_thumb-KMqoFzTp.jpg ; do
            grep -q "$BASE/$path" dist/index.html || { echo "falta la ruta $path"; exit 1; }
          done
          # marca: brand kit, no el repo del sitio
          # la marca incluye el logo del print-CV (#122): mismo resolvedor,
          # mismo pin del brand kit
          for path in favicon-aurea-teal.svg favicon-aurea-teal-32.png favicon-aurea-teal-16.png apple-touch-icon-aurea.png logo-aurea-settled-512.png ; do
            grep -q "$BRAND_BASE/assets/logo/$path" dist/index.html || { echo "falta la marca $path"; exit 1; }
          done
          grep -q "content=\"$BASE/public/assets/og-image.png\"" dist/index.html
          # 9 data-local (4 thumbs + 4 favicons + el logo del print, #122);
          # el OG es meta y no tiene fallback
          test "$(grep -o 'data-local=' dist/index.html | wc -l)" -eq 9
      - name: build en modo Pages (sin data-local, index.html sin drift)
        run: |
          npm run build
          ! grep -q 'data-local=' dist/index.html
          grep -q 'href="/assets/brand/favicon-aurea-teal.svg"' dist/index.html
          # un index.html commiteado en modo CDN rompe build.test.ts; este gate
          # lo dice con el diff, no con un test de 10 líneas de distancia
          git diff --exit-code -- index.html
      # gate real de paginación del print-CV (F3 de #119): mide el PDF de Chrome
      # sobre dist/, no el texto del CSS. Falla si una página no es A4, si el
      # footer de procedencia queda solo en la última página o si la última
      # página queda casi vacía (<20% de la extensión de la página más llena).
      - run: npm run print:verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
