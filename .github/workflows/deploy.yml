name: Deploy to GitHub Pages

# Builds the site with Vite and publishes the compiled dist/ to GitHub Pages.
# Requires Pages "Source" to be set to "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Base de la CDN de assets (ADR docs/cdn-decision.md, #84). Sin la
      # variable `CDN_BASE_URL` definida en el repo, queda vacía y todo se
      # sirve desde Pages: el deploy es idéntico al de antes de la migración.
      - run: npm run build
        env:
          VITE_ASSET_BASE_URL: ${{ vars.CDN_BASE_URL }}
          VITE_BRAND_KIT_BASE_URL: ${{ vars.BRAND_KIT_CDN_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
