name: Refresh now

# Refresca «Ahora» desde `ChristianLuciani/now` (#117): único job con red;
# commitea snapshot + módulo + index.html y despacha CI/deploy (el push con
# GITHUB_TOKEN no los dispara).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-now
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Resolver el tag estable más nuevo del productor
        id: tag
        run: |
          TAG="$(git ls-remote --tags --refs --sort=-v:refname https://github.com/ChristianLuciani/now.git 'v*' \
                 | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          test -n "$TAG" || { echo "sin tags estables vX.Y.Z en el productor"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # El valor entra por env (NUNCA interpolado en el script) y se valida ANTES
      # de usarlo: un ref con `$()` o backticks no es un tag. Con el MISMO tag,
      # sync:now verifica el digest del pin; un tag nuevo es un re-pin TOFU.
      - name: Re-pinear y verificar el snapshot
        env:
          TAG_RAW: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$TAG_RAW"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag inválido: '$TAG'"; exit 1; }
          npm run sync:now -- --tag "$TAG"

      # El bloque «Ahora» es HTML estático: sin reconstruir, build.test.ts marca drift.
      # El golden también depende de esos datos (el feed entra al render): si no se
      # regenera acá, el primer cambio del feed pone la suite en rojo y congela la
      # sección. Es un cambio de datos, no de presentación: `Golden-Cambio: datos`.
      - run: npm run golden:update
      - run: npm run build:html
      - run: npm test

      - name: Commitear solo si el pin o los bytes cambiaron
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git diff --quiet -- now.lock.json src/data/now.snapshot.json src/data/now.generated.ts index.html tests/golden/museo.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "now: sin cambios (pin $TAG)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add now.lock.json src/data/now.snapshot.json src/data/now.generated.ts index.html tests/golden/museo.html
          git commit -m "chore(now): refresh snapshot from ChristianLuciani/now@$TAG" -m "Golden-Cambio: datos"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Idempotente y recuperable: si el dispatch falló tras el push, un re-run
      # (changed=false) igual lo completa; si ya hay run para ese commit, no duplica.
      - name: Asegurar CI y deploy sobre el commit actual
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$HEAD_SHA" origin/main || { echo "HEAD no está en main: no se despacha"; exit 0; }
          case "$(git log -1 --format=%s)" in
            "chore(now): refresh snapshot from ChristianLuciani/now@"*) ;;
            *) echo "HEAD no es un refresh: no se despacha"; exit 0 ;;
          esac
          for wf in ci.yml deploy.yml; do
            if [ "$(gh run list --workflow "$wf" --commit "$HEAD_SHA" --limit 1 --json databaseId --jq 'length')" = "0" ]; then
              gh workflow run "$wf" --ref main; echo "dispatch $wf @ $HEAD_SHA"
            else echo "$wf ya tiene run para $HEAD_SHA"; fi
          done
