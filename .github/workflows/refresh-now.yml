name: Refresh now

# Refresca «Ahora» desde `ChristianLuciani/now` (#117): único job con red.
# Re-pinea el tag, regenera snapshot + módulo + index.html + golden, y publica
# por PR — `main` exige el check `build-test`, así que el bot no puede pushear
# directo (GH006) ni dejar el commit en un runner. Flujo completo:
#   1. commit en la rama `chore/now-refresh`
#   2. PR contra `main` (se reusa si quedó uno abierto)
#   3. `ci.yml` despachado sobre la rama: el PR lo abre `GITHUB_TOKEN`, así que
#      el evento `pull_request` NO dispara workflows y `build-test` no correría
#      solo (la protección de `main` lo exige y el merge quedaría bloqueado)
#   4. merge squash cuando `build-test` está verde
#   5. `ci.yml` + `deploy.yml` despachados sobre `main`: el merge lo hace el
#      bot, así que el `push` tampoco dispara workflows
# Con el mismo tag, `sync:now` verifica el digest del pin; un tag nuevo es un
# re-pin TOFU. Fallar en cualquier paso deja el PR abierto y el job en rojo.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-now
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolver el tag estable más nuevo del productor
        id: tag
        run: |
          TAG="$(git ls-remote --tags --refs --sort=-v:refname https://github.com/ChristianLuciani/now.git 'v*' \
                 | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          test -n "$TAG" || { echo "sin tags estables vX.Y.Z en el productor"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # El valor entra por env (NUNCA interpolado en el script) y se valida ANTES
      # de usarlo: un ref con `$()` o backticks no es un tag.
      - name: Re-pinear y verificar el snapshot
        env:
          TAG_RAW: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$TAG_RAW"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag inválido: '$TAG'"; exit 1; }
          npm run sync:now -- --tag "$TAG"

      # El bloque «Ahora» es HTML estático: sin reconstruir, build.test.ts marca drift.
      # El golden también depende de esos datos (el feed entra al render): si no se
      # regenera acá, el primer cambio del feed pone la suite en rojo y congela la
      # sección. Es un cambio de datos, no de presentación: `Golden-Cambio: datos`.
      # `golden:update` regenera el baseline de CADA tema registrado (#133): se
      # commitea el directorio entero, no sólo museo.html.
      - run: npm run golden:update
      - run: npm run build:html
      - run: npm test

      - name: Commitear en la rama de refresh si el pin o los bytes cambiaron
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git diff --quiet -- now.lock.json src/data/now.snapshot.json src/data/now.generated.ts index.html tests/golden; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "now: sin cambios (pin $TAG)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/now-refresh
          git add now.lock.json src/data/now.snapshot.json src/data/now.generated.ts index.html tests/golden
          git commit -m "chore(now): refresh snapshot from ChristianLuciani/now@$TAG" -m "Golden-Cambio: datos"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Abrir el PR, correr build-test y mergear
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH='chore/now-refresh'

          # `build-test` sobre la rama: el chequeo que `main` exige para mergear.
          # Se lee del rollup del PR (atado al head SHA), no del run más nuevo:
          # tras un force-push un run viejo ya no dice nada sobre este commit.
          wait_build_test() {
            gh workflow run ci.yml --ref "$BRANCH"
            local states='' pending=''
            for _ in $(seq 1 80); do
              # El run del evento `pull_request` de un PR abierto por el bot queda
              # en `action_required` hasta que un humano lo apruebe; ese suite
              # pendiente deja `statusCheckRollup` en null, así que sin este probe
              # el loop gira hasta el timeout y muere sin decir por qué.
              pending="$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 10 \
                         --json databaseId,conclusion \
                         --jq '[.[] | select(.conclusion == "action_required")][0].databaseId // empty' \
                         2>/dev/null || true)"
              if [ -n "$pending" ]; then
                echo "::error::el CI de $BRANCH espera aprobación humana (run $pending, action_required)"
                echo "Aprobalo y reintentá: gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$pending/approve"
                exit 1
              fi
              states="$(gh pr view "$PR" --json statusCheckRollup \
                        --jq '[.statusCheckRollup[] | select(.name == "build-test") | (.conclusion // .state // "PENDING")] | join(",")' \
                        2>/dev/null || true)"
              case "$states" in
                *FAILURE*|*CANCELLED*|*TIMED_OUT*|*ACTION_REQUIRED*)
                  echo "::error::build-test en $BRANCH falló ($states)"; exit 1 ;;
                *SUCCESS*) return 0 ;;
              esac
              sleep 15
            done
            echo "::error::build-test en $BRANCH no terminó a tiempo"
            exit 1
          }

          # `--force`, no `--force-with-lease`: el checkout del runner sólo trae
          # `main` (fetch-depth 1), así que la ref de la rama no existe local y el
          # lease falla con "stale info". La rama es del bot y descartable: se
          # reescribe en cada refresh.
          git push --quiet --force origin "HEAD:refs/heads/$BRANCH"

          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            printf '%s\n' \
              "Re-pinea «Ahora» a \`ChristianLuciani/now@$TAG\` y regenera snapshot, módulo, index.html y golden." \
              "Lo abre el refresh automático: el cambio es sólo de datos y la suite completa ya corrió en verde antes de commitear." \
              "" \
              "Golden-Cambio: datos" > /tmp/now-pr-body.md
            gh pr create --head "$BRANCH" --base main \
              --title "chore(now): refresh snapshot to $TAG" \
              --body-file /tmp/now-pr-body.md
            PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          test -n "$PR" || { echo '::error::no se pudo abrir el PR del refresh'; exit 1; }
          echo "PR #$PR ($BRANCH @ $TAG)"

          wait_build_test

          # `main` puede haber avanzado desde el checkout: rebase y un CI más.
          if ! gh pr merge "$PR" --squash --delete-branch; then
            echo "merge de #$PR rechazado; rebase sobre main y reintento"
            git fetch --quiet origin main
            git rebase --quiet origin/main
            git push --quiet --force origin "HEAD:refs/heads/$BRANCH"
            wait_build_test
            gh pr merge "$PR" --squash --delete-branch
          fi

          # El merge lo hizo el bot: el `push` no dispara workflows.
          gh workflow run ci.yml --ref main
          gh workflow run deploy.yml --ref main
          echo "refresh publicado: PR #$PR mergeado y deploy despachado"
